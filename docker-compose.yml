services:
  # PHP-FPM + berkas aplikasi (volume app_data dibagikan ke nginx)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cash-flow:latest
    env_file:
      - docker/app.env
    volumes:
      - app_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # MySQL 8 — kredensial sama dengan docker/app.env
  db:
    image: mysql:8.4
    env_file:
      - docker/db.env
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Nginx — menyajikan public/ dari volume yang sama + meneruskan *.php ke app:9000
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - app_data:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app_data:
  db_data:
